spring.application.name=orderbook
spring.datasource.url=jdbc:postgresql://localhost:5432/orderbook
spring.datasource.username=orderbook
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-min-32-characters-long}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orderbook}
app.jwt.expiry-minutes=60
spring.jpa.open-in-view=false