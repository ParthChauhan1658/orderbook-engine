services:
  db:
    image: postgres:16
    container_name: orderbook-db
    environment:
      POSTGRES_DB: orderbook
      POSTGRES_USER: orderbook
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderbook -d orderbook"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: orderbook-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orderbook
      SPRING_DATASOURCE_USERNAME: orderbook
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  pgdata: